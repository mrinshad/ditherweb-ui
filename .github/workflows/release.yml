name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate publish without uploading to npm)"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release & Publish @ditherweb/ui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build @ditherweb/ui package
        run: npm run build:ui

      - name: Run snippet and consumer verification
        run: |
          npm run test:snippets
          npm run test:consumer

      - name: Pack npm tarball
        id: pack
        run: |
          mkdir -p release-artifacts
          TARBALL=$(npm pack --pack-destination=release-artifacts ./packages/ui)
          echo "tarball_name=${TARBALL}" >> $GITHUB_OUTPUT
          echo "tarball_path=release-artifacts/${TARBALL}" >> $GITHUB_OUTPUT
          echo "Created tarball: ${TARBALL}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Publishing in DRY-RUN mode (dry_run=${{ inputs.dry_run }})..."
            npm publish ./packages/ui --access public --dry-run
          else
            echo "Publishing @ditherweb/ui to npm registry with provenance..."
            npm publish ./packages/ui --access public --provenance
          fi
