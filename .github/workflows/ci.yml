name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint across workspaces
        run: npm run lint

      - name: Check TypeScript types across workspaces
        run: npm run typecheck

  package-and-consumer-tests:
    name: Package Build & Consumer Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @ditherweb/ui package
        run: npm run build:ui

      - name: Verify all component & README code snippets
        run: npm run test:snippets

      - name: Run automated consumer test suites (Vite, Next.js, React 18/19)
        run: npm run test:consumer

  build-website:
    name: Build Documentation Website
    runs-on: ubuntu-latest
    needs: package-and-consumer-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build @ditherweb/ui package
        run: npm run build:ui

      - name: Build Next.js documentation website
        run: npm run build:website
